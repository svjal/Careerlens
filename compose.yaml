services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: careerlens
      POSTGRES_USER: careerlens
      POSTGRES_PASSWORD: ${CAREERLENS_DB_PASSWORD:-local-dev-only}
    ports:
      - "${CAREERLENS_DB_PORT:-5433}:5432"
    volumes:
      - careerlens-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerlens -d careerlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://careerlens:${CAREERLENS_DB_PASSWORD:-local-dev-only}@db:5432/careerlens
      JWT_SECRET_KEY: ${CAREERLENS_JWT_SECRET:-local-compose-dev-secret-change-before-deploy}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ALLOWED_ORIGINS: "http://127.0.0.1:${CAREERLENS_FRONTEND_PORT:-5173},http://localhost:${CAREERLENS_FRONTEND_PORT:-5173}"
      CAREER_ANALYSIS_PROVIDER: rules
    ports:
      - "${CAREERLENS_API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${CAREERLENS_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${CAREERLENS_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  careerlens-postgres:
