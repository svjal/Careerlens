name: CareerLens checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://careerlens:career-lens-ci-only@127.0.0.1:5432/careerlens
      JWT_SECRET_KEY: github-actions-placeholder-not-a-real-secret
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: careerlens
          POSTGRES_USER: careerlens
          POSTGRES_PASSWORD: career-lens-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerlens -d careerlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser journey
        working-directory: frontend
        env:
          CAREERLENS_E2E_USE_CI_DATABASE: "true"
        run: npm run test:e2e
